name: kleos
description: Render SVG cards of the pull requests, issues and discussions you opened in other people's repos, and commit them.
author: garysassano
branding:
  icon: award
  color: purple

inputs:
  designs:
    description: >-
      The cards to render: design ids from the catalog (gallery/README.md), one per line or separated
      by spaces, each followed by its settings, such as "A05 owners=no repos=3".
    required: true
  pr-outcomes:
    description: >-
      How PR results are shown: none (PRs as one number), merged (merged PRs highlighted) or full
      (merged, open, and closed without merging).
    default: full
  ecosystems:
    description: >-
      Extra ecosystems, one per line, as "Name: regular expression" matched against the whole owner
      login, such as "jdx: ^jdx$". They are added to kleos's defaults; one with a default's name
      replaces it.
    default: ""
  default-ecosystems:
    description: Start from kleos's default ecosystems (AWS, HashiCorp, OpenTelemetry, Microsoft, Cloudflare, GitHub). Set to false to use only your own.
    default: "true"
  user:
    description: GitHub login whose contributions are shown.
    default: ${{ github.repository_owner }}
  out-dir:
    description: Folder in the repository that receives the cards.
    default: kleos
  commit:
    description: >-
      Commit and push the cards when they changed. Needs "permissions: contents: write" and a
      checked-out repository.
    default: "true"
  commit-message:
    description: Message of that commit.
    default: Update kleos cards
  token:
    description: Token for the GitHub GraphQL API. The workflow's own token is enough for public data.
    default: ${{ github.token }}

runs:
  using: composite
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: "26"

    - name: Render cards
      shell: bash
      run: node "$GITHUB_ACTION_PATH/src/cli/action.ts"
      env:
        INPUT_USER: ${{ inputs.user }}
        INPUT_DESIGNS: ${{ inputs.designs }}
        INPUT_PR_OUTCOMES: ${{ inputs.pr-outcomes }}
        INPUT_ECOSYSTEMS: ${{ inputs.ecosystems }}
        INPUT_DEFAULT_ECOSYSTEMS: ${{ inputs.default-ecosystems }}
        INPUT_OUT_DIR: ${{ inputs.out-dir }}
        GITHUB_TOKEN: ${{ inputs.token }}

    - name: Commit cards
      if: inputs.commit == 'true'
      shell: bash
      env:
        OUT: ${{ inputs.out-dir }}
        MESSAGE: ${{ inputs.commit-message }}
      run: |
        git add -A -- "$OUT"
        if git diff --cached --quiet; then
          echo "Cards unchanged, nothing to commit."
          exit 0
        fi
        git -c user.name="github-actions[bot]" \
          -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
          commit -m "$MESSAGE"
        git push
